[package]
name = "farming6"
version = "1.0.0"
edition = "2021"
description = "Farming 6: acceso, menú y CRUD de Perfil, Usuario y Persona. Parcial I de Ingeniería de Software III."
build = "build.rs"

# Tres dependencias directas, cada una por una razón:
# eframe  : ventana nativa e interfaz gráfica.
# rusqlite: acceso a la base relacional SQLite con consultas parametrizadas.
# argon2  : cifrado de contraseñas (nunca se guardan en claro).
[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
rusqlite = "0.32"
argon2 = "0.5"
# Viene con argon2; aquí solo activa la fuente de azar del sistema operativo para las sales.
password-hash = { version = "0.5", features = ["getrandom"] }

[features]
# Solo para pruebas: la aplicación fotografía sus propias pantallas.
captura = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true
